<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register into Smart Pantry</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section class="section">
        <div class="container">
            <h1 class="title">Register</h1>
            <form action="/register" method="POST" class="form">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
                <label for="confirm_password">Confirm Password:</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
                
                <fieldset>
                    <legend>dietary preferences</legend>
                   <label><input type="checkbox" name="preferences" value="vegan"/>Vegan</label><br />
                   <label><input type="checkbox" name="preferences" value="gluten-free"/>Gluten-free</label><br />
                   <label><input type="checkbox" name="preferences" value="lactose-free"/>Lactose-free</label><br />
                   <label><input type="checkbox" name="preferences" value="keto-diet"/>Keto-diet</label><br />

                   <label for="other_preferences">Other dietary preferences:</label>
                     <input type="text" id="other_preferences" name="other_preferences" placeholder="e.g., vegetarian, paleo, etc.">

                   <label for="terms">I have read and agree to the <a href="terms.html">terms and conditions</a> </label> 

                </fieldset>

                <button type="submit" class="button">Register</button>
                </form>
                </div>
                </section>
                </body>
</html>
