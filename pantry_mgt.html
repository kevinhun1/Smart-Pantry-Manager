<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pantry Items</title>
  <link rel="stylesheet" href="pm-styles.css" />
</head>
<body>
  <div class="container">
    <input type="text" class="search-bar" placeholder="Search items to add to Inventory" />
    <div class="grid">
      <div class="card">
        <img src="https://www.foodmatters.com/media/cache/d8/5e/d85e964937f1a0c2c03119c114f602b6.jpg" alt="Kales"/>
        <div class="card-content">
          <div class="card-title">Kales</div>
          <div class="card-qty">Qty: 3 bunches</div>
        </div>
      </div>

      <div class="card">
        <img src="https://img.huffingtonpost.com/asset/5cd8505521000035007ea940.jpeg?ops=scalefit_720_noupscale&format=webp" alt="Potatoes"/>
        <div class="card-content">
          <div class="card-title">Potatoes</div>
          <div class="card-qty">Qty: 1 sack</div>
        </div>
      </div>

      <div class="card">
        <img src="http://wovenmeadows.com/wordpress/wp-content/uploads/2012/10/Valdale-Farm-Eggs-1005-300x199.jpg" alt="Egg"/>
        <div class="card-content">
          <div class="card-title">Eggs</div>
          <div class="card-qty">Qty: 4 Trays</div>
        </div>
      </div>

      <div class="card">
        <img src="https://static4.depositphotos.com/1020804/343/i/950/depositphotos_3434992-stock-photo-maize.jpg" alt="Maize"/>
        <div class="card-content">
          <div class="card-title">Maize</div>
          <div class="card-qty">Qty: 10 cobs</div>
        </div>
      </div>

      <div class="card">
        <img src="https://thumbs.dreamstime.com/b/red-bean-sack-wooden-background-78734928.jpg?w=360" alt="Beans"/>
        <div class="card-content">
          <div class="card-title">Beans</div>
          <div class="card-qty">Qty: 5 sacks</div>
        </div>
      </div>

      <div class="card">
        <img src="https://wallpapers.com/images/high/pineapple-pictures-olwkz7pb56oud0uj.webp" alt="Pineapples"/>
        <div class="card-content">
          <div class="card-title">Pineapples</div>
          <div class="card-qty">Qty: 10</div>
        </div>
      </div>

      <div class="card">
        <img src="https://cdn.pixabay.com/photo/2024/01/09/22/11/avocado-8498520_1280.jpg" alt="Avocado"/>
        <div class="card-content">
          <div class="card-title">Avocadoes</div>
          <div class="card-qty">Qty: 20</div>
        </div>
      </div>

      <div class="card">
        <img src="https://www.aces.edu/wp-content/uploads/2018/09/shutterstock_583043998.jpg" alt="Beef"/>
        <div class="card-content">
          <div class="card-title">Beef</div>
          <div class="card-qty">Qty: 10 Kg</div>
        </div>
      </div>

      <div class="card">
        <img src="https://images.pexels.com/photos/161559/background-bitter-breakfast-bright-161559.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" alt="Oranges"/>
        <div class="card-content">
          <div class="card-title">Oranges</div>
          <div class="card-qty">Qty: 10</div>
        </div>
      </div>

      <div class="card">
        <img src="https://wallsdesk.com/wp-content/uploads/2017/01/Mango-Photos.jpg" alt="Mangoes"/>
        <div class="card-content">
          <div class="card-title">Mangoes</div>
          <div class="card-qty">Sacks: 20</div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
