<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Smart Pantry Manager</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"/>
  <style>
    .login-container {
      max-width: 400px;
      margin: 4rem auto;
      padding: 2rem;
      background: #ffffff;
      box-shadow: 0 4px 12px rgba(0, 128, 0, 0.1);
      border-radius: 8px;
    }

    .login-container h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: #2e7d32;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 500;
      color: #23402a;
    }

    .form-group input {
      width: 100%;
      padding: 0.6rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: inherit;
      font-size: 1rem;
    }

    .form-group input:focus {
      border-color: #43a047;
      outline: none;
    }

    .login-button {
      width: 100%;
      padding: 0.7rem;
      background: linear-gradient(90deg, #43a047 60%, #81c784 100%);
      color: #fff;
      border: none;
      border-radius: 24px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .login-button:hover {
      background: linear-gradient(90deg, #388e3c 60%, #66bb6a 100%);
    }

    .login-footer {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.95rem;
    }

    .login-footer a {
      color: #2e7d32;
      text-decoration: none;
      font-weight: 500;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-logo">
    <a href="index.html" class="logo"><i class="fas fa-leaf"></i> SmartPantry</a>
  </div>

  <div class="login-container">
    <h2>Login to Your Pantry</h2>
    <form action="/login" method="POST">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Enter your password" />
      </div>
      <button type="submit" class="login-button">Login</button>
    </form>
    <div class="login-footer">
      Don't have an account?
      <a href="register.html" class="button register-link">Register</a>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <span>&copy; 2025 Smart Pantry Manager. All rights reserved.</span>
    </div>
  </footer>

</body>
</html>
